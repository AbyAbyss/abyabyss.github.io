    <rect x="304" y="396" width="46" height="7" rx="3.5"/><rect x="400" y="396" width="132" height="7" rx="3.5"/><rect x="540" y="396" width="74" height="7" rx="3.5"/>
  </g>

  <text x="480" y="484" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="800" fill="url(#dcac)">DevConnect</text>
  <text x="480" y="508" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#7e8e99">Databases · Docs · REST · Plugins — one desktop app</text>
