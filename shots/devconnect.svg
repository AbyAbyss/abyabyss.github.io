  <rect x="120" y="136" width="150" height="308" fill="#18242d"/>
  <g fill="#2ed3a7" opacity=".9">
    <rect x="140" y="160" width="10" height="10" rx="2"/>
    <rect x="140" y="192" width="10" height="10" rx="2"/>
    <rect x="140" y="224" width="10" height="10" rx="2"/>
    <rect x="140" y="256" width="10" height="10" rx="2"/>
