<svg width="420" height="880" viewBox="0 0 420 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rbal" x1="0" y1="0" x2="380" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E2422"/>
      <stop offset="0.5" stop-color="#12312A"/>
      <stop offset="1" stop-color="#0E3B30"/>
    </linearGradient>
    <clipPath id="rscreen"><rect x="10" y="10" width="400" height="860" rx="46"/></clipPath>
  </defs>

  <!-- phone frame -->
  <rect x="0" y="0" width="420" height="880" rx="56" fill="#1B1A17"/>
  <rect x="10" y="10" width="400" height="860" rx="46" fill="#F7F4EE"/>

  <g clip-path="url(#rscreen)" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="44" y="46" font-size="14" font-weight="600" fill="#1B1A17">9:41</text>
    <rect x="176" y="26" width="68" height="22" rx="11" fill="#1B1A17"/>

    <text x="36" y="104" font-size="24" font-weight="800" fill="#1B1A17">Reports</text>

    <!-- period selector -->
    <g font-size="12.5" font-weight="600">
      <rect x="36" y="122" width="86" height="32" rx="16" fill="#1C6B4C"/>
      <text x="79" y="143" text-anchor="middle" fill="#FFFFFF">This month</text>
      <rect x="130" y="122" width="58" height="32" rx="16" fill="#1B1A17" fill-opacity="0.05"/>
      <text x="159" y="143" text-anchor="middle" fill="#6B6860">2026</text>
      <rect x="196" y="122" width="70" height="32" rx="16" fill="#1B1A17" fill-opacity="0.05"/>
      <text x="231" y="143" text-anchor="middle" fill="#6B6860">All time</text>
      <rect x="274" y="122" width="72" height="32" rx="16" fill="#1B1A17" fill-opacity="0.05"/>
      <text x="310" y="143" text-anchor="middle" fill="#6B6860">Custom</text>
    </g>

    <!-- headline card -->
    <rect x="28" y="170" width="364" height="150" rx="22" fill="url(#rbal)"/>
    <text x="52" y="204" font-size="12" letter-spacing="1" fill="#FFFFFF" fill-opacity="0.55">TOTAL GIVEN</text>
    <text x="50" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#FFFFFF">₹7,700</text>
    <text x="52" y="294" font-size="13" fill="#FFFFFF" fill-opacity="0.65">of ₹80,000 income</text>
    <!-- effective % ring -->
    <circle cx="334" cy="238" r="34" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="7" fill="none"/>
    <circle cx="334" cy="238" r="34" stroke="#4FD79B" stroke-width="7" fill="none" stroke-linecap="round"
            stroke-dasharray="20.5 193" transform="rotate(-90 334 238)"/>
    <text x="334" y="236" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">9.6%</text>
    <text x="334" y="252" text-anchor="middle" font-size="9" letter-spacing="0.6" fill="#FFFFFF" fill-opacity="0.6">EFFECTIVE</text>

    <!-- by category -->
    <text x="36" y="362" font-size="16" font-weight="700" fill="#1B1A17">By category</text>
    <rect x="28" y="378" width="364" height="168" rx="20" fill="#FFFFFF" stroke="#1B1A17" stroke-opacity="0.06"/>
    <g font-size="13">
      <text x="48" y="410" font-weight="600" fill="#1B1A17">Tithe</text>
      <text x="372" y="410" text-anchor="end" fill="#6B6860">₹6,000 / ₹6,000</text>
      <rect x="48" y="420" width="324" height="8" rx="4" fill="#1B1A17" fill-opacity="0.06"/>
      <rect x="48" y="420" width="324" height="8" rx="4" fill="#1C6B4C"/>

      <text x="48" y="458" font-weight="600" fill="#1B1A17">Missions</text>
      <text x="372" y="458" text-anchor="end" fill="#6B6860">₹1,200 / ₹2,000</text>
      <rect x="48" y="468" width="324" height="8" rx="4" fill="#1B1A17" fill-opacity="0.06"/>
      <rect x="48" y="468" width="194" height="8" rx="4" fill="#1E7A8C"/>

      <text x="48" y="506" font-weight="600" fill="#1B1A17">Charity</text>
      <text x="372" y="506" text-anchor="end" fill="#6B6860">₹500 / ₹1,500</text>
      <rect x="48" y="516" width="324" height="8" rx="4" fill="#1B1A17" fill-opacity="0.06"/>
      <rect x="48" y="516" width="108" height="8" rx="4" fill="#B5623C"/>
    </g>

    <!-- income by source + consistency -->
    <rect x="28" y="562" width="216" height="130" rx="20" fill="#FFFFFF" stroke="#1B1A17" stroke-opacity="0.06"/>
    <text x="48" y="590" font-size="13" font-weight="700" fill="#1B1A17">Income by source</text>
    <g font-size="11.5" fill="#6B6860">
      <text x="48" y="616">Salary</text>
      <rect x="48" y="624" width="176" height="7" rx="3.5" fill="#1B1A17" fill-opacity="0.06"/>
      <rect x="48" y="624" width="150" height="7" rx="3.5" fill="#8A6414"/>
      <text x="48" y="654">Freelance</text>
      <rect x="48" y="662" width="176" height="7" rx="3.5" fill="#1B1A17" fill-opacity="0.06"/>
      <rect x="48" y="662" width="52" height="7" rx="3.5" fill="#B4831F"/>
    </g>

    <rect x="256" y="562" width="136" height="130" rx="20" fill="#FFFFFF" stroke="#1B1A17" stroke-opacity="0.06"/>
    <text x="324" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1A17">Consistency</text>
    <circle cx="324" cy="640" r="30" stroke="#1B1A17" stroke-opacity="0.07" stroke-width="6" fill="none"/>
    <circle cx="324" cy="640" r="30" stroke="#1C6B4C" stroke-width="6" fill="none" stroke-linecap="round"
            stroke-dasharray="173 188" transform="rotate(-90 324 640)"/>
    <text x="324" y="646" text-anchor="middle" font-size="16" font-weight="800" fill="#1B1A17">92%</text>

    <!-- export buttons -->
    <rect x="28" y="712" width="176" height="48" rx="16" fill="#1B1A17" fill-opacity="0.05"/>
    <text x="116" y="742" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1B1A17">Export CSV</text>
    <rect x="216" y="712" width="176" height="48" rx="16" fill="#1C6B4C"/>
    <text x="304" y="742" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Year-end PDF</text>

    <!-- floating nav bar -->
    <rect x="36" y="792" width="348" height="58" rx="24" fill="#FFFFFF" fill-opacity="0.94" stroke="#1B1A17" stroke-opacity="0.07"/>
    <g stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M84 826 L84 814 L92 807 L100 814 L100 826 Z" stroke="#9A968C"/>
      <circle cx="146" cy="818" r="8" stroke="#9A968C"/><path d="M146 813 L146 818 L150 821" stroke="#9A968C"/>
      <path d="M270 826 L270 818 M278 826 L278 812 M286 826 L286 821" stroke="#1C6B4C"/>
      <circle cx="336" cy="815" r="4.5" stroke="#9A968C"/><path d="M328 828 C328 823 344 823 344 828" stroke="#9A968C"/>
    </g>
    <circle cx="210" cy="818" r="26" fill="#1C6B4C"/>
    <path d="M210 808 L210 828 M200 818 L220 818" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

    <rect x="150" y="856" width="120" height="4" rx="2" fill="#1B1A17" fill-opacity="0.25"/>
  </g>
</svg>
