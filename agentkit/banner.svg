<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentKit banner" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="akBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16182F"/>
      <stop offset="0.55" stop-color="#121528"/>
      <stop offset="1" stop-color="#0A0B15"/>
    </linearGradient>
    <linearGradient id="akIcon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#6B4FD4"/>
    </linearGradient>
    <linearGradient id="akWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A8C4FF"/>
    </linearGradient>
    <linearGradient id="akAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#9B7BEF"/>
    </linearGradient>
    <linearGradient id="akPanelSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="akSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="akGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="akGlass" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#akBg)"/>
  <circle cx="210" cy="42" r="145" fill="#4D7CFF" opacity="0.24" filter="url(#akSoft)"/>
  <circle cx="920" cy="170" r="120" fill="#6B5AE8" opacity="0.14" filter="url(#akSoft)"/>
  <circle cx="1010" cy="310" r="165" fill="#8A5BF0" opacity="0.18" filter="url(#akSoft)"/>

  <!-- logo -->
  <g transform="translate(84,92)">
    <rect width="132" height="132" rx="30" fill="url(#akIcon)"/>
    <g transform="translate(66,66)" filter="url(#akGlow)">
      <circle r="18" fill="#FFFFFF"/>
      <circle cx="-34" cy="-22" r="10" fill="#D8E4FF"/>
      <circle cx="36" cy="-18" r="9" fill="#D8E4FF"/>
      <circle cx="0" cy="34" r="9" fill="#D8E4FF"/>
      <path d="M-34,-22 L-12,-8 M36,-18 L12,-6 M0,34 L0,18" stroke="#6B4FD4" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="28" y="98" width="76" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="38" y="104" width="22" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="64" y="104" width="30" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.32"/>
  </g>

  <text x="250" y="158" font-size="86" font-weight="800" letter-spacing="-2.5" fill="url(#akWord)">AgentKit</text>
  <text x="253" y="198" font-size="22" font-weight="500" fill="#9197BC">AI agent SDK for TypeScript. AG-UI native wire.</text>

  <g transform="translate(253,218)">
    <g>
      <rect width="118" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect width="118" height="32" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="59" y="21" font-size="13" font-weight="600" fill="#C8CEEA" text-anchor="middle">@agentkit/core</text>
    </g>
    <g transform="translate(130,0)">
      <rect width="72" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect width="72" height="32" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="36" y="21" font-size="13" font-weight="600" fill="#C8CEEA" text-anchor="middle">SSE</text>
    </g>
    <g transform="translate(214,0)">
      <rect width="64" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect width="64" height="32" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="32" y="21" font-size="13" font-weight="600" fill="#C8CEEA" text-anchor="middle">MCP</text>
    </g>
    <text x="298" y="22" font-size="15" font-weight="500" fill="#787FA6">drop into any stack</text>
  </g>

  <!-- AgentKit AG-UI session panel (not clipboard/list UI) -->
  <g transform="translate(798,52)" filter="url(#akGlass)">
    <rect width="338" height="236" rx="20" fill="#12152C" fill-opacity="0.72"/>
    <rect width="338" height="236" rx="20" fill="url(#akPanelSheen)"/>
    <rect width="338" height="236" rx="20" fill="url(#akAccent)" fill-opacity="0.05"/>
    <rect width="338" height="236" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>

    <!-- search header -->
    <g transform="translate(18,18)">
      <circle cx="11" cy="14" r="7" fill="none" stroke="#5B8CFF" stroke-width="2.2"/>
      <line x1="16" y1="19" x2="21" y2="24" stroke="#5B8CFF" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="30" y="4" width="270" height="28" rx="9" fill="#0A0C18" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <rect x="42" y="15" width="118" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.08"/>
    </g>

    <line x1="14" y1="62" x2="324" y2="62" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- row 1: plan -->
    <rect x="12" y="72" width="314" height="50" rx="11" fill="#4D7CFF" fill-opacity="0.16"/>
    <circle cx="38" cy="97" r="13" fill="#5B8CFF"/>
    <path d="M33.5 97 H42.5 M38 92.5 V101.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="62" y="86" width="158" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.62"/>
    <rect x="62" y="100" width="108" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.26"/>
    <rect x="252" y="87" width="58" height="20" rx="7" fill="#8B6CE8" fill-opacity="0.55" stroke="#B89AFF" stroke-opacity="0.35"/>
    <text x="281" y="101" font-size="10.5" font-weight="700" fill="#F0E8FF" text-anchor="middle">plan</text>

    <!-- row 2: tool:ok -->
    <rect x="28" y="136" width="22" height="22" rx="6" fill="#2ECC87"/>
    <rect x="62" y="140" width="132" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.44"/>
    <rect x="62" y="154" width="78" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="252" y="136" width="60" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="282" y="151" font-size="10" font-weight="600" fill="#9AA3C8" text-anchor="middle">tool:ok</text>

    <!-- row 3: stream:token -->
    <rect x="28" y="184" width="22" height="22" rx="6" fill="#6278F0"/>
    <rect x="62" y="188" width="146" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.44"/>
    <rect x="62" y="202" width="96" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.22"/>
    <rect x="228" y="184" width="84" height="22" rx="7" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="270" y="199" font-size="10" font-weight="600" fill="#9AA3C8" text-anchor="middle">stream:token</text>
  </g>
</svg>
