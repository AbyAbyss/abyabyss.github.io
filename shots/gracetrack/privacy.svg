<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E2422"/>
      <stop offset="0.55" stop-color="#12312A"/>
      <stop offset="1" stop-color="#0E3B30"/>
    </linearGradient>
    <linearGradient id="pgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B4831F"/>
      <stop offset="1" stop-color="#E6AE4E"/>
    </linearGradient>
    <clipPath id="pround"><rect width="1200" height="330" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#pround)" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="1200" height="330" fill="url(#pbg)"/>

    <text x="600" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F6F3EA">Your data never touches anyone else's server</text>
    <text x="600" y="88" text-anchor="middle" font-size="15.5" fill="#8A9198">The app talks straight to Google's own APIs from your device — there is no GraceTrack backend, no analytics, no man in the middle.</text>

    <!-- Phone node -->
    <g>
      <rect x="130" y="128" width="250" height="140" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#5CC892" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- phone glyph -->
      <rect x="166" y="158" width="44" height="80" rx="10" fill="none" stroke="#5CC892" stroke-width="2.5"/>
      <rect x="181" y="166" width="14" height="3.5" rx="1.75" fill="#5CC892"/>
      <circle cx="188" cy="228" r="3.5" fill="#5CC892"/>
      <text x="232" y="185" font-size="18" font-weight="700" fill="#F6F3EA">Your phone</text>
      <text x="232" y="210" font-size="13.5" fill="#AEB4B9">Local SQLite database.</text>
      <text x="232" y="230" font-size="13.5" fill="#AEB4B9">Works fully offline —</text>
      <text x="232" y="250" font-size="13.5" fill="#AEB4B9">sign-in is optional.</text>
    </g>

    <!-- Direct connection -->
    <g>
      <line x1="392" y1="198" x2="796" y2="198" stroke="#5CC892" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"/>
      <path d="M788 190 L800 198 L788 206" stroke="#5CC892" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M400 190 L388 198 L400 206" stroke="#5CC892" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="474" y="136" width="240" height="30" rx="15" fill="#12312A" stroke="#5CC892" stroke-opacity="0.4"/>
      <text x="594" y="156" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5CC892">Direct HTTPS · Google OAuth 2.0</text>

      <!-- crossed-out server -->
      <g>
        <rect x="544" y="216" width="100" height="52" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#8A9198" stroke-opacity="0.5" stroke-dasharray="5 4"/>
        <line x1="562" y1="232" x2="590" y2="232" stroke="#8A9198" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="562" y1="244" x2="602" y2="244" stroke="#8A9198" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="622" cy="238" r="3" fill="#8A9198" fill-opacity="0.5"/>
        <line x1="536" y1="212" x2="652" y2="274" stroke="#E6AE4E" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="652" y1="212" x2="536" y2="274" stroke="#E6AE4E" stroke-width="3.5" stroke-linecap="round"/>
        <text x="594" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#E6AE4E">NO middle server. Ever.</text>
      </g>
    </g>

    <!-- Google Drive node -->
    <g>
      <rect x="820" y="128" width="250" height="140" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#5CC892" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- sheet glyph -->
      <rect x="856" y="158" width="58" height="76" rx="8" fill="none" stroke="#5CC892" stroke-width="2.5"/>
      <line x1="856" y1="182" x2="914" y2="182" stroke="#5CC892" stroke-width="2"/>
      <line x1="856" y1="200" x2="914" y2="200" stroke="#5CC892" stroke-width="2"/>
      <line x1="856" y1="218" x2="914" y2="218" stroke="#5CC892" stroke-width="2"/>
      <line x1="876" y1="182" x2="876" y2="234" stroke="#5CC892" stroke-width="2"/>
      <text x="934" y="185" font-size="18" font-weight="700" fill="#F6F3EA">Your Drive</text>
      <text x="934" y="210" font-size="13.5" fill="#AEB4B9">One plain Google Sheet,</text>
      <text x="934" y="230" font-size="13.5" fill="#AEB4B9">in your account. Open it,</text>
      <text x="934" y="250" font-size="13.5" fill="#AEB4B9">audit it, export it. Yours.</text>
    </g>

    <rect x="0" y="322" width="1200" height="8" fill="url(#pgold)"/>
  </g>
</svg>
