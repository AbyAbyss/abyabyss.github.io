    <rect x="160" y="225" width="70" height="8" rx="4"/>
    <rect x="160" y="257" width="52" height="8" rx="4"/>
  </g>

  <!-- editor pane -->
  <rect x="286" y="156" width="538" height="132" rx="8" fill="#111a21" stroke="#27353f"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <text x="304" y="182" fill="#2ed3a7">SELECT</text><text x="358" y="182" fill="#c9d6de">id, email, created_at</text>
    <text x="304" y="204" fill="#2ed3a7">FROM</text><text x="346" y="204" fill="#c9d6de">users</text>
    <text x="304" y="226" fill="#2ed3a7">WHERE</text><text x="356" y="226" fill="#c9d6de">plan = 'pro'</text>
    <text x="304" y="248" fill="#2ed3a7">ORDER BY</text><text x="382" y="248" fill="#c9d6de">created_at DESC;</text>
  </g>
  <rect x="304" y="264" width="2" height="14" fill="#2ed3a7"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

  <!-- results -->
  <rect x="286" y="302" width="538" height="122" rx="8" fill="#111a21" stroke="#27353f"/>
  <rect x="286" y="302" width="538" height="26" rx="8" fill="#1f2e39"/>
  <g fill="#7e8e99"><rect x="304" y="311" width="54" height="8" rx="4"/><rect x="400" y="311" width="86" height="8" rx="4"/><rect x="540" y="311" width="70" height="8" rx="4"/></g>
  <g fill="#3d5361">
