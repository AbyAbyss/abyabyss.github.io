<svg viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentKit architecture" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16182F"/>
      <stop offset="1" stop-color="#0A0B15"/>
    </linearGradient>
    <linearGradient id="archNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242848"/>
      <stop offset="1" stop-color="#191C34"/>
    </linearGradient>
    <linearGradient id="archHub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C3360"/>
      <stop offset="1" stop-color="#222748"/>
    </linearGradient>
    <linearGradient id="archCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3A6E"/>
      <stop offset="1" stop-color="#3D2F6B"/>
    </linearGradient>
    <linearGradient id="archArrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#9B7BEF"/>
    </linearGradient>
    <filter id="archGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="archBlue" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0.5 L9,5 L0,9.5 Z" fill="#6E84EE"/>
    </marker>
    <marker id="archViolet" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0.5 L9,5 L0,9.5 Z" fill="#9B7BEF"/>
    </marker>
    <marker id="archGray" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto">
      <path d="M0,0.5 L9,5 L0,9.5 Z" fill="#6A719C"/>
    </marker>
  </defs>

  <rect width="1080" height="600" fill="url(#archBg)"/>
  <text x="44" y="48" font-size="13" font-weight="700" letter-spacing="3" fill="#474D78">AGENTKIT · DATA FLOW</text>

  <rect x="92" y="150" width="304" height="420" rx="24" fill="#4D7CFF" fill-opacity="0.05"/>
  <rect x="684" y="150" width="304" height="420" rx="24" fill="#9B7BEF" fill-opacity="0.05"/>
  <text x="116" y="176" font-size="12" font-weight="700" letter-spacing="3" fill="#6E84EE">WIRE</text>
  <text x="964" y="176" text-anchor="end" font-size="12" font-weight="700" letter-spacing="3" fill="#9B7BEF">ENGINE</text>

  <!-- arrows -->
  <g filter="url(#archGlow)">
    <line x1="482" y1="126" x2="262" y2="180" stroke="url(#archArrow)" stroke-width="2" marker-end="url(#archBlue)"/>
    <line x1="244" y1="272" x2="244" y2="317" stroke="#6E84EE" stroke-width="2" marker-end="url(#archBlue)"/>
    <line x1="244" y1="410" x2="244" y2="455" stroke="#6E84EE" stroke-width="2" marker-end="url(#archBlue)"/>
    <line x1="436" y1="233" x2="379" y2="228" stroke="#6A719C" stroke-width="2" marker-end="url(#archGray)"/>
    <line x1="836" y1="456" x2="836" y2="411" stroke="#9B7BEF" stroke-width="2" marker-end="url(#archViolet)"/>
    <line x1="836" y1="318" x2="836" y2="273" stroke="#9B7BEF" stroke-width="2" marker-end="url(#archViolet)"/>
    <line x1="816" y1="180" x2="604" y2="126" stroke="#9B7BEF" stroke-width="2" marker-end="url(#archViolet)"/>
    <line x1="376" y1="364" x2="703" y2="364" stroke="#6A719C" stroke-width="2" marker-end="url(#archGray)"/>
  </g>

  <!-- top hub -->
  <g>
    <rect x="400" y="40" width="280" height="84" rx="15" fill="url(#archHub)" stroke="#6E84EE" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="540" y="75" text-anchor="middle" font-size="16.5" font-weight="700" fill="#FFFFFF">Your UI</text>
    <text x="540" y="97" text-anchor="middle" font-size="12" fill="#9AA1C6">React · Vue · vanilla · CLI</text>
  </g>

  <!-- left column: wire down -->
  <g>
    <rect x="116" y="184" width="256" height="84" rx="14" fill="url(#archNode)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="244" y="214" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F1F2F9">@agentkit/client</text>
    <text x="244" y="236" text-anchor="middle" font-size="12" fill="#888FB4">connect · send · on</text>
  </g>
  <g>
    <rect x="116" y="322" width="256" height="84" rx="14" fill="url(#archNode)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="244" y="352" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F1F2F9">@agentkit/server</text>
    <text x="244" y="374" text-anchor="middle" font-size="12" fill="#888FB4">serve · AG-UI SSE stream</text>
  </g>
  <g>
    <rect x="116" y="460" width="256" height="84" rx="14" fill="url(#archCore)" stroke="#6E84EE" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="244" y="490" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">createAgent</text>
    <text x="244" y="512" text-anchor="middle" font-size="12" fill="#A8B4E8">@agentkit/core · config in, events out</text>
  </g>

  <!-- right column: engine up -->
  <g>
    <rect x="708" y="184" width="256" height="84" rx="14" fill="url(#archNode)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="836" y="214" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F1F2F9">Providers</text>
    <text x="836" y="236" text-anchor="middle" font-size="12" fill="#888FB4">Anthropic · OpenAI · routing</text>
  </g>
  <g>
    <rect x="708" y="322" width="256" height="84" rx="14" fill="url(#archNode)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="836" y="352" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F1F2F9">MCP + Sources</text>
    <text x="836" y="374" text-anchor="middle" font-size="12" fill="#888FB4">tools · read-only context feeds</text>
  </g>
  <g>
    <rect x="708" y="460" width="256" height="84" rx="14" fill="url(#archNode)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="836" y="490" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F1F2F9">Memory + Context</text>
    <text x="836" y="512" text-anchor="middle" font-size="12" fill="#888FB4">TOON encoding · compaction</text>
  </g>

  <!-- center bridge -->
  <g>
    <rect x="420" y="200" width="240" height="68" rx="13" fill="#1A1C30" stroke="#9B7BEF" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="540" y="228" text-anchor="middle" font-size="14.5" font-weight="700" fill="#D9DCEC">Orchestrator · Workflows</text>
    <text x="540" y="250" text-anchor="middle" font-size="11.5" fill="#7E85AC">parallel agents · static DAG · approvals</text>
  </g>

  <!-- arrow labels -->
  <text x="372" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#8E96C0">events</text>
  <text x="260" y="300" font-size="12" font-weight="600" fill="#8E96C0">send</text>
  <text x="260" y="438" font-size="12" font-weight="600" fill="#8E96C0">run</text>
  <text x="407" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#80879F">plan</text>
  <text x="852" y="438" font-size="12" font-weight="600" fill="#A59AD8">store</text>
  <text x="852" y="300" font-size="12" font-weight="600" fill="#A59AD8">tools</text>
  <text x="712" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#A59AD8">tokens</text>
  <g>
    <rect x="458" y="353" width="164" height="22" rx="7" fill="#13152A"/>
    <text x="540" y="368" text-anchor="middle" font-size="12" font-weight="600" fill="#9098BC">event bus inside core</text>
  </g>
</svg>
