<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="DevConnect — database, docs, REST and plugins in one desktop app">
  <defs>
    <linearGradient id="dcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2c36"/><stop offset="1" stop-color="#121c23"/>
    </linearGradient>
    <linearGradient id="dcac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ed3a7"/><stop offset="1" stop-color="#1c9b97"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#dcbg)"/>
  <g opacity=".5" stroke="#27353f" stroke-width="1">
    <path d="M0 135h960M0 270h960M0 405h960M240 0v540M480 0v540M720 0v540"/>
  </g>

  <!-- window chrome -->
  <rect x="120" y="96" width="720" height="348" rx="14" fill="#16222b" stroke="#33454f"/>
  <path d="M120 110a14 14 0 0 1 14-14h692a14 14 0 0 1 14 14v26H120z" fill="#1f2e39"/>
  <circle cx="146" cy="116" r="5" fill="#e0685f"/><circle cx="164" cy="116" r="5" fill="#e3b341"/><circle cx="182" cy="116" r="5" fill="#2ed3a7"/>

