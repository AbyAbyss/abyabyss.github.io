<svg width="420" height="880" viewBox="0 0 420 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hbal" x1="0" y1="0" x2="380" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E2422"/>
      <stop offset="0.5" stop-color="#12312A"/>
      <stop offset="1" stop-color="#0E3B30"/>
    </linearGradient>
    <clipPath id="hscreen"><rect x="10" y="10" width="400" height="860" rx="46"/></clipPath>
  </defs>

  <!-- phone frame -->
  <rect x="0" y="0" width="420" height="880" rx="56" fill="#1B1A17"/>
  <rect x="10" y="10" width="400" height="860" rx="46" fill="#F7F4EE"/>

  <g clip-path="url(#hscreen)" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- status bar -->
    <text x="44" y="46" font-size="14" font-weight="600" fill="#1B1A17">9:41</text>
    <rect x="342" y="34" width="22" height="12" rx="3" stroke="#1B1A17" stroke-opacity="0.4" fill="none"/>
    <rect x="344" y="36" width="14" height="8" rx="1.5" fill="#1C6B4C"/>
    <circle cx="326" cy="40" r="1.8" fill="#1B1A17" fill-opacity="0.6"/>
    <circle cx="319" cy="40" r="1.8" fill="#1B1A17" fill-opacity="0.6"/>
    <circle cx="312" cy="40" r="1.8" fill="#1B1A17" fill-opacity="0.6"/>
    <rect x="176" y="26" width="68" height="22" rx="11" fill="#1B1A17"/>

    <!-- greeting header -->
    <text x="36" y="96" font-size="14" fill="#9A968C">Good morning,</text>
    <text x="36" y="120" font-size="19" font-weight="700" fill="#1B1A17">Aby</text>
    <circle cx="344" cy="104" r="8.5" stroke="#6B6860" stroke-width="1.6" fill="none"/>
    <path d="M344 95.5 A8.5 8.5 0 0 0 344 112.5 Z" fill="#6B6860"/>
    <circle cx="382" cy="104" r="17" fill="#1C6B4C"/>
    <text x="382" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">A</text>

    <!-- hero -->
    <text x="36" y="168" font-size="13.5" letter-spacing="1.2" fill="#9A968C">GIVEN THIS MONTH</text>
    <text x="33" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#1B1A17" letter-spacing="-1">₹12,450</text>
    <path d="M38 250 L44 242 L50 250" stroke="#1C6B4C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="251" font-size="13.5" font-weight="600" fill="#1C6B4C">18% vs. last month</text>

    <!-- outstanding / pay card -->
    <rect x="28" y="272" width="364" height="112" rx="22" fill="url(#hbal)"/>
    <text x="52" y="308" font-size="12.5" letter-spacing="1" fill="#FFFFFF" fill-opacity="0.55">OUTSTANDING</text>
    <text x="50" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#FFFFFF">₹3,550</text>
    <circle cx="200" cy="345" r="3" fill="#4FD79B">
      <animate attributeName="fill-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="210" y="350" font-size="12.5" fill="#FFFFFF" fill-opacity="0.6">2 awaiting</text>
    <rect x="302" y="316" width="66" height="40" rx="20" fill="#4FD79B"/>
    <text x="335" y="341" text-anchor="middle" font-size="15" font-weight="700" fill="#12312A">Pay</text>

    <!-- cards / focus toggle -->
    <text x="36" y="426" font-size="16" font-weight="700" fill="#1B1A17">Categories</text>
    <rect x="284" y="408" width="108" height="30" rx="15" fill="#1B1A17" fill-opacity="0.05"/>
    <rect x="287" y="411" width="52" height="24" rx="12" fill="#FFFFFF"/>
    <text x="313" y="427" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1B1A17">Cards</text>
    <text x="366" y="427" text-anchor="middle" font-size="11.5" fill="#9A968C">Focus</text>

    <!-- category cards -->
    <g>
      <rect x="28" y="446" width="176" height="140" rx="20" fill="#FFFFFF" stroke="#1B1A17" stroke-opacity="0.06"/>
      <circle cx="56" cy="478" r="14" fill="#1C6B4C" fill-opacity="0.14"/>
      <text x="56" y="483" text-anchor="middle" font-size="12" fill="#1C6B4C">⛪</text>
      <rect x="140" y="466" width="50" height="20" rx="10" fill="#1C6B4C" fill-opacity="0.12"/>
      <text x="165" y="480" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#1C6B4C">AUTO</text>
      <text x="44" y="522" font-size="15" font-weight="700" fill="#1B1A17">Tithe</text>
      <text x="44" y="541" font-size="11.5" fill="#9A968C">10% of income</text>
      <text x="44" y="570" font-size="11.5" fill="#6B6860">Outstanding</text>
      <text x="190" y="570" text-anchor="end" font-size="14" font-weight="700" fill="#1C6B4C">₹2,000</text>
    </g>
    <g>
      <rect x="216" y="446" width="176" height="140" rx="20" fill="#FFFFFF" stroke="#1B1A17" stroke-opacity="0.06"/>
      <circle cx="244" cy="478" r="14" fill="#1E7A8C" fill-opacity="0.14"/>
      <text x="244" y="483" text-anchor="middle" font-size="12" fill="#1E7A8C">🌍</text>
      <rect x="316" y="466" width="62" height="20" rx="10" fill="#1B1A17" fill-opacity="0.06"/>
      <text x="347" y="480" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="0.6" fill="#6B6860">MANUAL</text>
      <text x="232" y="522" font-size="15" font-weight="700" fill="#1B1A17">Missions</text>
      <text x="232" y="541" font-size="11.5" fill="#9A968C">Give as led</text>
      <text x="232" y="570" font-size="11.5" fill="#6B6860">Outstanding</text>
      <text x="378" y="570" text-anchor="end" font-size="14" font-weight="700" fill="#1E7A8C">₹1,550</text>
    </g>

    <!-- recent activity -->
    <text x="36" y="628" font-size="16" font-weight="700" fill="#1B1A17">Recent activity</text>
    <text x="392" y="628" text-anchor="end" font-size="12.5" font-weight="600" fill="#1C6B4C">See all</text>
    <rect x="28" y="644" width="364" height="128" rx="20" fill="#FFFFFF" stroke="#1B1A17" stroke-opacity="0.06"/>
    <g>
      <circle cx="60" cy="680" r="16" fill="#8A6414" fill-opacity="0.12"/>
      <path d="M60 673 L60 687 M54 679 L60 673 L66 679" stroke="#8A6414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="676" font-size="13.5" font-weight="600" fill="#1B1A17">Salary</text>
      <text x="88" y="693" font-size="11.5" fill="#9A968C">Today · auto-split ₹2,000</text>
      <text x="376" y="686" text-anchor="end" font-size="14" font-weight="600" fill="#8A6414">+₹20,000</text>
    </g>
    <line x1="44" y1="708" x2="376" y2="708" stroke="#1B1A17" stroke-opacity="0.06"/>
    <g>
      <circle cx="60" cy="740" r="16" fill="#1C6B4C" fill-opacity="0.12"/>
      <path d="M60 733 L60 747 M54 741 L60 747 L66 741" stroke="#1C6B4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="736" font-size="13.5" font-weight="700" fill="#1B1A17">Tithe · Local Church</text>
      <text x="88" y="753" font-size="11.5" fill="#9A968C">Today</text>
      <circle cx="360" cy="730" r="3" fill="#E6AE4E"/>
      <text x="376" y="746" text-anchor="end" font-size="14" font-weight="700" fill="#1C6B4C">−₹2,000</text>
    </g>

    <!-- floating nav bar -->
    <rect x="36" y="792" width="348" height="58" rx="24" fill="#FFFFFF" fill-opacity="0.94" stroke="#1B1A17" stroke-opacity="0.07"/>
    <g stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M84 826 L84 814 L92 807 L100 814 L100 826 Z" stroke="#1C6B4C"/>
      <circle cx="146" cy="818" r="8" stroke="#9A968C"/><path d="M146 813 L146 818 L150 821" stroke="#9A968C"/>
      <path d="M270 826 L270 818 M278 826 L278 812 M286 826 L286 821" stroke="#9A968C"/>
      <circle cx="336" cy="815" r="4.5" stroke="#9A968C"/><path d="M328 828 C328 823 344 823 344 828" stroke="#9A968C"/>
    </g>
    <circle cx="210" cy="818" r="26" fill="#1C6B4C"/>
    <path d="M210 808 L210 828 M200 818 L220 818" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

    <rect x="150" y="856" width="120" height="4" rx="2" fill="#1B1A17" fill-opacity="0.25"/>
  </g>
</svg>
