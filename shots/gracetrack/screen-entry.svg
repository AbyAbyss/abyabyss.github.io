<svg width="420" height="880" viewBox="0 0 420 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="escreen"><rect x="10" y="10" width="400" height="860" rx="46"/></clipPath>
  </defs>

  <!-- phone frame -->
  <rect x="0" y="0" width="420" height="880" rx="56" fill="#000000"/>
  <rect x="10" y="10" width="400" height="860" rx="46" fill="#121618"/>

  <g clip-path="url(#escreen)" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- dimmed home behind the sheet -->
    <g opacity="0.35">
      <text x="44" y="46" font-size="14" font-weight="600" fill="#F1EDE6">9:41</text>
      <text x="36" y="100" font-size="14" fill="#8A9198">Good evening,</text>
      <text x="36" y="124" font-size="19" font-weight="700" fill="#F1EDE6">Aby</text>
      <text x="36" y="168" font-size="13.5" letter-spacing="1.2" fill="#8A9198">GIVEN THIS MONTH</text>
      <text x="33" y="224" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#F1EDE6">₹12,450</text>
    </g>
    <rect x="176" y="26" width="68" height="22" rx="11" fill="#000000"/>

    <!-- slide-up amount sheet -->
    <rect x="10" y="248" width="400" height="622" rx="32" fill="#1B2124"/>
    <rect x="186" y="262" width="48" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.18"/>

    <text x="210" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#F1EDE6">Log income</text>
    <text x="386" y="304" text-anchor="end" font-size="20" fill="#8A9198">×</text>

    <!-- serif amount -->
    <text x="210" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#F1EDE6" letter-spacing="-1">₹20,000</text>

    <!-- source chips -->
    <g font-size="13" font-weight="600">
      <rect x="76" y="420" width="76" height="34" rx="17" fill="#E6AE4E" fill-opacity="0.16" stroke="#E6AE4E" stroke-opacity="0.7"/>
      <text x="114" y="442" text-anchor="middle" fill="#E6AE4E">Salary</text>
      <rect x="160" y="420" width="98" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="209" y="442" text-anchor="middle" fill="#AEB4B9">Freelance</text>
      <rect x="266" y="420" width="78" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06"/>
      <text x="305" y="442" text-anchor="middle" fill="#AEB4B9">Other</text>
    </g>

    <!-- live auto-allocation preview -->
    <rect x="36" y="472" width="348" height="64" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
    <text x="56" y="497" font-size="11.5" letter-spacing="0.8" fill="#8A9198">AUTO-SPLIT PREVIEW</text>
    <circle cx="62" cy="516" r="4" fill="#5CC892"/>
    <text x="74" y="521" font-size="13" fill="#F1EDE6">Tithe <tspan font-weight="700">₹2,000</tspan></text>
    <circle cx="196" cy="516" r="4" fill="#1E7A8C"/>
    <text x="208" y="521" font-size="13" fill="#F1EDE6">Missions <tspan font-weight="700">₹1,000</tspan></text>

    <!-- keypad -->
    <g font-size="26" fill="#F1EDE6" text-anchor="middle">
      <g font-weight="500">
        <text x="98" y="596">1</text><text x="210" y="596">2</text><text x="322" y="596">3</text>
        <text x="98" y="662">4</text><text x="210" y="662">5</text><text x="322" y="662">6</text>
        <text x="98" y="728">7</text><text x="210" y="728">8</text><text x="322" y="728">9</text>
        <text x="210" y="794">0</text>
      </g>
      <text x="98" y="792" font-size="22" fill="#8A9198">·</text>
      <g stroke="#8A9198" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M310 776 L318 784 M318 776 L310 784 M304 771 L322 771 C326 771 330 774 330 780 C330 786 326 789 322 789 L304 789 L294 780 Z"/>
      </g>
    </g>

    <!-- save button (amber = income) -->
    <rect x="36" y="812" width="348" height="52" rx="18" fill="#E6AE4E"/>
    <text x="210" y="845" text-anchor="middle" font-size="16" font-weight="700" fill="#1B1A17">Save income</text>
  </g>
</svg>
